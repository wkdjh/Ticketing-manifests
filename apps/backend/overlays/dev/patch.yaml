apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          image: 062025573047.dkr.ecr.ap-northeast-2.amazonaws.com/ticketing-prod-backend:3721b2a
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
spec:
  rules:
    - host: api-dev.example.com
