apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: backend
          image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/backend:prod
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
spec:
  rules:
    - host: api.example.com
